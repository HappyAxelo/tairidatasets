# Paste this block inside the existing HTTPS server { ... } for
# aceiot.ur.ac.rw on the server's MAIN Nginx (not the Docker one), then run:
#   sudo nginx -t && sudo systemctl reload nginx
#
# It forwards https://aceiot.ur.ac.rw/datahub/* to the TAIRI DataHub stack
# started with docker-compose.prod.yml (listening on 127.0.0.1:8080).

location /datahub {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket (real-time notifications)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Large dataset uploads
    client_max_body_size 5g;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
