# TAIRI DataHub — full-stack deployment.
# Usage:
#   cp .env.example .env   # then edit secrets
#   docker compose up -d --build
#
# Services: PostgreSQL, FastAPI backend, Next.js frontend, Nginx reverse proxy.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tairi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tairi_password}
      POSTGRES_DB: ${POSTGRES_DB:-tairi_datahub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tairi} -d ${POSTGRES_DB:-tairi_datahub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [tairi]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tairi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tairi_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tairi_datahub}
      SECRET_KEY: ${SECRET_KEY:-please-change-me}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SUPERADMIN_EMAILS: ${SUPERADMIN_EMAILS:-admin1@tairi.ur.ac.rw,admin2@tairi.ur.ac.rw,admin3@tairi.ur.ac.rw}
      SUPERADMIN_DEFAULT_PASSWORD: ${SUPERADMIN_DEFAULT_PASSWORD:-ChangeMe#2026}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - storage:/app/storage
    networks: [tairi]

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    networks: [tairi]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"   # enable after configuring TLS certificates
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks: [tairi]

volumes:
  pgdata:
  storage:

networks:
  tairi:
    driver: bridge
